<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520">
  <defs>
    <style>
      .green-fill { fill: #39FF14; }
      .green-stroke { stroke: #39FF14; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .text-black { fill: #FFFFFF; font-family: 'Michroma', 'Orbitron', sans-serif; font-weight: 700; }
      .text-phone { fill: #39FF14; font-family: 'Michroma', 'Orbitron', sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Group: Horse Mascot (Left side) -->
  <g id="horse-head" transform="translate(10, 10)">
    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M 125 105 C 115 65 80 40 70 12 C 100 28 122 55 142 90 Z" fill="#39FF14" />
    <!-- Left Ear inner fold line -->
    <path d="M 94 38 C 106 55 116 75 125 98" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3" />

    <!-- Right Ear -->
    <path d="M 158 88 C 168 50 192 30 215 10 C 208 42 198 70 185 92 Z" fill="#39FF14" />
    <!-- Right Ear inner line -->
    <path d="M 194 34 C 188 54 182 72 176 86" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3" />

    <!-- Forelock Tuft -->
    <path d="M 142 85 C 132 110 152 135 145 158 C 138 135 128 118 138 85 Z" fill="#39FF14" />
    <path d="M 152 75 C 172 95 198 112 218 128 C 188 120 166 105 152 75 Z" fill="#39FF14" />

    <!-- Face profile & Cheek Lines -->
    <!-- Left forehead and cheek contour -->
    <path d="M 112 130 C 88 158 80 205 90 248 C 96 275 106 300 120 318" class="green-stroke" stroke-width="12" />

    <!-- Face Center Ridge / Blaze -->
    <path d="M 166 145 C 160 180 156 220 154 255 C 151 280 149 302 147 320" class="green-stroke" stroke-width="8" />

    <!-- Left Eye -->
    <path d="M 86 126 C 94 118 108 120 115 128" class="green-stroke" stroke-width="9" />
    <ellipse cx="102" cy="136" rx="6" ry="11" fill="#39FF14" transform="rotate(-15 102 136)" />

    <!-- Right Eye -->
    <path d="M 182 132 C 192 125 204 127 210 137" class="green-stroke" stroke-width="9" />
    <ellipse cx="196" cy="142" rx="6" ry="11" fill="#39FF14" transform="rotate(15 196 142)" />

    <!-- Muzzle / Nose Contour -->
    <path d="M 120 318 C 134 332 166 332 180 318 C 192 295 199 270 203 245" class="green-stroke" stroke-width="12" />

    <!-- Nostrils -->
    <ellipse cx="132" cy="285" rx="9" ry="16" fill="#39FF14" transform="rotate(15 132 285)" />
    <ellipse cx="172" cy="285" rx="9" ry="16" fill="#39FF14" transform="rotate(-15 172 285)" />

    <!-- Smile line -->
    <path d="M 122 308 C 138 322 164 322 180 308" class="green-stroke" stroke-width="10" />

    <!-- Mane Strands (Right Side flowing) -->
    <!-- Mane Strand 1 (Top curl) -->
    <path d="M 215 100 C 265 110 315 125 348 148 C 300 148 260 140 218 130" class="green-stroke" stroke-width="11" />
    <path d="M 215 100 C 248 108 285 118 318 132 C 285 136 252 132 220 125 Z" fill="#39FF14" />

    <!-- Mane Strand 2 (Upper middle) -->
    <path d="M 218 140 C 275 160 330 185 378 218 C 325 218 278 205 222 180" class="green-stroke" stroke-width="11" />
    <path d="M 218 140 C 265 155 318 175 365 200 C 322 200 275 190 225 175 Z" fill="#39FF14" />

    <!-- Mane Strand 3 (Middle main wave) -->
    <path d="M 220 190 C 270 218 320 252 358 292 C 312 282 268 260 218 232" class="green-stroke" stroke-width="11" />
    <path d="M 220 190 C 265 210 308 240 342 272 C 305 265 268 248 220 225 Z" fill="#39FF14" />

    <!-- Mane Strand 4 (Lower swoop) -->
    <path d="M 204 252 C 238 285 272 325 292 368 C 265 342 235 315 195 290" class="green-stroke" stroke-width="10" />
    <path d="M 210 240 C 242 265 278 298 302 338 C 272 322 242 298 202 275 Z" fill="#39FF14" />

    <!-- Mane Strand 5 (Bottom subtle curl) -->
    <path d="M 190 295 C 218 322 245 358 258 395 C 238 375 215 350 182 328" class="green-stroke" stroke-width="8" />

    <!-- Chest Wings / Feathers / Tuft (Bottom Left) -->
    <!-- Wing 1 (Top) -->
    <path d="M 94 250 C 68 280 42 315 12 345 C 42 332 75 310 100 288" class="green-stroke" stroke-width="11" />
    <path d="M 94 250 C 72 275 48 305 24 328 C 48 318 72 300 90 282 Z" fill="#39FF14" />

    <!-- Wing 2 (Middle) -->
    <path d="M 98 290 C 72 322 45 355 18 385 C 48 368 85 342 110 320" class="green-stroke" stroke-width="11" />
    <path d="M 98 290 C 78 315 52 342 28 365 C 52 352 80 332 102 315 Z" fill="#39FF14" />

    <!-- Wing 3 (Bottom) -->
    <path d="M 108 322 C 85 352 60 385 38 412 C 68 395 102 368 128 348" class="green-stroke" stroke-width="11" />
    <path d="M 108 322 C 90 345 70 370 48 392 C 70 380 95 360 118 342 Z" fill="#39FF14" />
  </g>

  <!-- Group: KENO Letters (Right side) using vector paths for 100% exact rendering -->
  <g id="keno-text" fill="#39FF14" transform="translate(360, 48)">
    <!-- Letter K -->
    <path d="M 0 0 L 52 0 L 52 102 L 105 0 L 168 0 L 98 116 L 174 252 L 112 252 L 52 138 L 52 252 L 0 252 Z" />

    <!-- Letter E -->
    <path d="M 195 0 L 332 0 L 332 50 L 248 50 L 248 98 L 320 98 L 320 148 L 248 148 L 248 202 L 336 202 L 336 252 L 195 252 Z" />

    <!-- Letter N -->
    <path d="M 360 0 L 415 0 L 485 152 L 485 0 L 536 0 L 536 252 L 482 252 L 411 100 L 411 252 L 360 252 Z" />

    <!-- Letter O -->
    <path d="M 622 0 C 665 0 698 25 708 72 C 712 90 712 162 708 180 C 698 227 665 252 622 252 C 578 252 546 227 536 180 C 532 162 532 90 536 72 C 546 25 578 0 622 0 Z M 622 52 C 596 52 588 78 588 126 C 588 174 596 200 622 200 C 648 200 656 174 656 126 C 656 78 648 52 622 52 Z" />
  </g>

  <!-- Subtitle: portable services llc -->
  <text x="30" y="440" class="text-black" font-size="52" letter-spacing="1.2">portable services llc</text>

  <!-- Phone: (858) 328-9815 -->
  <text x="165" y="504" class="text-phone" font-size="52" letter-spacing="2">(858) 328-9815</text>
</svg>
